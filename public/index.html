<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Globalli Notifications — Live Demo</title>
<style>
  :root {
    --bg-base: #0d0f14;
    --bg-surface: #161a22;
    --bg-raised: #1f2430;
    --text-primary: #e8ebf2;
    --text-muted: #8b93a7;
    --accent-primary: #7c5cff;
    --cat-game: #f5b942;
    --cat-social: #3ccf91;
    --border-default: #2a3040;
    --state-error: #ff5d6c;
    --state-success: #3ccf91;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    --radius-sm: 6px;
    --radius-md: 12px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg-base); color: var(--text-primary); font: 14px/1.45 var(--font-sans); }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0; }
  h1 span { color: var(--accent-primary); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); margin: 0 0 12px; }
  .muted { color: var(--text-muted); }
  .card { background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: var(--radius-md); padding: 16px; }
  .grid { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  .console { margin-bottom: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
  label.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text-muted); }
  select, input[type="number"], input[type="text"] {
    background: var(--bg-raised); color: var(--text-primary); border: 1px solid var(--border-default);
    border-radius: var(--radius-sm); padding: 7px 9px; font: inherit; min-width: 0;
  }
  input[type="number"] { width: 90px; }
  button {
    background: var(--accent-primary); color: var(--text-primary); border: 0; border-radius: var(--radius-sm);
    padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button.secondary { background: var(--bg-raised); border: 1px solid var(--border-default); }
  button:disabled { opacity: .5; cursor: default; }
  .hint { margin-top: 10px; font-size: 12px; min-height: 1.4em; }
  .hint.error { color: var(--state-error); }
  .pane-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--state-error); }
  .dot.on { background: var(--state-success); }
  .toggles { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .toggle { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: var(--radius-sm);
    border: 1px solid var(--border-default); background: var(--bg-raised); cursor: pointer; user-select: none; font-size: 13px; }
  .toggle input { accent-color: var(--accent-primary); }
  .toggle.GAME { border-left: 3px solid var(--cat-game); }
  .toggle.SOCIAL { border-left: 3px solid var(--cat-social); }
  .feed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; max-height: 420px; overflow-y: auto; }
  .feed:empty::after { content: "No notifications yet."; color: var(--text-muted); font-size: 13px; }
  .note { display: grid; grid-template-columns: 28px 1fr; gap: 8px; padding: 10px 12px; background: var(--bg-raised);
    border-radius: var(--radius-sm); border-left: 3px solid var(--cat-game); animation: slide .25s ease-out; }
  .note.SOCIAL { border-left-color: var(--cat-social); }
  .note.read { opacity: .6; }
  .note .icon { font-size: 18px; line-height: 1.2; }
  .note .title { font-weight: 600; font-size: 13px; }
  .note .meta { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); }
  @keyframes slide { from { transform: translateY(-6px); opacity: 0; } to { transform: none; opacity: 1; } }
  .log { margin-top: 16px; }
  .log ol { list-style: none; margin: 0; padding: 0; font-family: var(--font-mono); font-size: 12px; max-height: 220px; overflow-y: auto; }
  .log li { padding: 4px 0; border-bottom: 1px solid var(--border-default); }
  .log li:empty, .log ol:empty::after { content: "Fire an event to see how the system routes it."; color: var(--text-muted); }
  .tag-sent { color: var(--state-success); }
  .tag-supp { color: var(--state-error); }
  .tag-none { color: var(--text-muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Globalli <span>Notifications</span> · live demo</h1>
    <span class="muted">Events → preferences → in-app delivery over WebSocket</span>
  </header>

  <section class="card console" aria-labelledby="console-title">
    <h2 id="console-title">Simulate platform events</h2>
    <form id="event-form" class="row">
      <label class="field">Event
        <select id="event-type"></select>
      </label>
      <span id="event-fields" class="row"></span>
      <button type="submit">Fire event</button>
      <button type="button" class="secondary" id="run-brief">Run brief examples</button>
    </form>
    <div id="hint" class="hint muted" role="status"></div>
  </section>

  <div class="grid" id="panes"></div>

  <section class="card log">
    <h2>System activity</h2>
    <ol id="activity"></ol>
  </section>
</div>

<template id="pane-tpl">
  <section class="card pane">
    <div class="pane-head">
      <label class="field">Viewing as
        <select class="player-select"></select>
      </label>
      <span class="status"><span class="dot"></span><span class="status-text">offline</span></span>
    </div>
    <div class="toggles"></div>
    <ul class="feed" aria-live="polite"></ul>
  </section>
</template>

<script>
"use strict";

const ICONS = {
  LEVEL_UP: "⬆️", ITEM_ACQUIRED: "🗡️", CHALLENGE_COMPLETED: "🏆", PVP_ATTACKED: "⚔️",
  PVP_DEFEATED: "💀", FRIEND_REQUEST: "🤝", FRIEND_ACCEPTED: "✅", NEW_FOLLOWER: "👀",
};
const CATEGORY_LABELS = { GAME: "Game events", SOCIAL: "Social events" };

// Field layout for each simulated event, matching POST /api/events.
const EVENTS = {
  PLAYER_LEVELED_UP:       { label: "Level up",              fields: [["playerId", "player", "Player"], ["newLevel", "number", "New level", 15]] },
  ITEM_ACQUIRED:           { label: "Item acquired",         fields: [["playerId", "player", "Player"], ["itemId", "item", "Item"]] },
  CHALLENGE_COMPLETED:     { label: "Challenge completed",   fields: [["playerId", "player", "Player"], ["challengeName", "text", "Challenge", "Dragon Slayer"]] },
  PLAYER_ATTACKED:         { label: "PvP: attacked",         fields: [["attackerId", "player", "Attacker", 2], ["victimId", "player", "Victim", 1]] },
  PLAYER_DEFEATED:         { label: "PvP: defeated",         fields: [["winnerId", "player", "Winner", 2], ["loserId", "player", "Loser", 1]] },
  FRIEND_REQUEST_SENT:     { label: "Friend request sent",   fields: [["fromPlayerId", "player", "From", 3], ["toPlayerId", "player", "To", 1]] },
  FRIEND_REQUEST_ACCEPTED: { label: "Friend request accepted", fields: [["accepterId", "player", "Accepter", 1], ["requesterId", "player", "Requester", 3]] },
  NEW_FOLLOWER:            { label: "New follower",          fields: [["followerId", "player", "Follower", 2], ["followedId", "player", "Followed", 1]] },
};

const BRIEF_EXAMPLES = [
  { type: "PLAYER_LEVELED_UP", playerId: 1, newLevel: 15 },
  { type: "ITEM_ACQUIRED", playerId: 2, itemId: "SwordOfAzeroth" },
  { type: "FRIEND_REQUEST_SENT", fromPlayerId: 3, toPlayerId: 1 },
  { type: "FRIEND_REQUEST_ACCEPTED", accepterId: 1, requesterId: 3 },
];

const state = { players: [], items: [] };
const $ = (sel, root = document) => root.querySelector(sel);
const nameOf = (id) => state.players.find((p) => p.id === id)?.name ?? `#${id}`;

async function api(path, options = {}) {
  const res = await fetch(path, { headers: { "content-type": "application/json" }, ...options });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body?.error?.message ?? `HTTP ${res.status}`);
  return body.data;
}

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k === "text") node.textContent = v;
    else node.setAttribute(k, v);
  }
  node.append(...children);
  return node;
}

function setHint(text, isError = false) {
  const hint = $("#hint");
  hint.textContent = text;
  hint.classList.toggle("error", isError);
}

/* ---------- Event console ---------- */

function renderEventFields() {
  const def = EVENTS[$("#event-type").value];
  const container = $("#event-fields");
  container.replaceChildren();
  for (const [name, kind, label, initial] of def.fields) {
    let input;
    if (kind === "player") {
      input = el("select", { name });
      for (const p of state.players) input.append(el("option", { value: p.id, text: `${p.id} · ${p.name}` }));
      input.value = String(initial ?? 1);
    } else if (kind === "item") {
      input = el("select", { name });
      for (const i of state.items) input.append(el("option", { value: i.id, text: `${i.name} (${i.rarity})` }));
    } else {
      input = el("input", { name, type: kind === "number" ? "number" : "text", value: initial ?? "", min: "1" });
    }
    container.append(el("label", { class: "field" }, label, input));
  }
}

function readEventForm() {
  const type = $("#event-type").value;
  const payload = { type };
  for (const [name, kind] of EVENTS[type].fields) {
    const raw = $(`[name="${name}"]`, $("#event-fields")).value;
    payload[name] = kind === "player" || kind === "number" ? Number(raw) : raw;
  }
  return payload;
}

async function fire(payload) {
  await api("/api/events", { method: "POST", body: JSON.stringify(payload) });
}

/* ---------- Player panes ---------- */

class PlayerPane {
  constructor(root, initialPlayerId, isActivitySource) {
    this.root = root;
    this.isActivitySource = isActivitySource;
    this.socket = null;
    this.select = $(".player-select", root);
    for (const p of state.players) this.select.append(el("option", { value: p.id, text: `${p.id} · ${p.name}` }));
    this.select.value = String(initialPlayerId);
    this.select.addEventListener("change", () => this.connect());
    this.connect();
  }

  get playerId() { return Number(this.select.value); }

  setStatus(online) {
    $(".dot", this.root).classList.toggle("on", online);
    $(".status-text", this.root).textContent = online ? "connected" : "offline";
  }

  async renderPreferences() {
    const prefs = await api(`/api/players/${this.playerId}/preferences`);
    const box = $(".toggles", this.root);
    box.replaceChildren();
    for (const [category, enabled] of Object.entries(prefs)) {
      const input = el("input", { type: "checkbox" });
      input.checked = enabled;
      input.addEventListener("change", async () => {
        try {
          await api(`/api/players/${this.playerId}/preferences`, {
            method: "PUT", body: JSON.stringify({ [category]: input.checked }),
          });
          setHint(`${nameOf(this.playerId)}: ${CATEGORY_LABELS[category]} ${input.checked ? "enabled" : "disabled"}.`);
        } catch (err) {
          input.checked = !input.checked;
          setHint(err.message, true);
        }
      });
      box.append(el("label", { class: `toggle ${category}` }, input, CATEGORY_LABELS[category] ?? category));
    }
  }

  renderNotification(n, prepend = true) {
    const item = el("li", { class: `note ${n.category}${n.read ? " read" : ""}` },
      el("span", { class: "icon", "aria-hidden": "true", text: ICONS[n.type] ?? "🔔" }),
      el("div", {},
        el("div", { class: "title", text: n.title }),
        el("div", { text: n.message }),
        el("div", { class: "meta", text: `${n.category} · ${new Date(n.createdAt).toLocaleTimeString()}` }),
      ),
    );
    const feed = $(".feed", this.root);
    prepend ? feed.prepend(item) : feed.append(item);
  }

  connect() {
    if (this.socket) {
      this.socket.onclose = null;
      this.socket.close();
    }
    $(".feed", this.root).replaceChildren();
    this.setStatus(false);
    this.renderPreferences().catch((err) => setHint(err.message, true));

    const proto = location.protocol === "https:" ? "wss" : "ws";
    const socket = new WebSocket(`${proto}://${location.host}/ws?userId=${this.playerId}`);
    this.socket = socket;
    socket.onopen = () => this.setStatus(true);
    socket.onclose = () => {
      this.setStatus(false);
      setTimeout(() => this.socket === socket && this.connect(), 2000); // simple reconnect
    };
    socket.onmessage = (msg) => {
      const { type, data } = JSON.parse(msg.data);
      if (type === "welcome") data.history.forEach((n) => this.renderNotification(n, false));
      if (type === "notification") this.renderNotification(data);
      if (type === "activity" && this.isActivitySource) renderActivity(data);
    };
  }
}

function renderActivity({ eventType, at, sent, suppressed }) {
  const parts = [el("span", { text: `${new Date(at).toLocaleTimeString()}  ${eventType}  → ` })];
  for (const s of sent) {
    parts.push(el("span", { class: "tag-sent", text: `sent to ${nameOf(s.userId)}${s.online ? "" : " (offline, saved to inbox)"}  ` }));
  }
  for (const s of suppressed) {
    parts.push(el("span", { class: "tag-supp", text: `suppressed for ${nameOf(s.userId)} (${s.category} off)  ` }));
  }
  if (sent.length === 0 && suppressed.length === 0) {
    parts.push(el("span", { class: "tag-none", text: "no notification (filtered by rules)" }));
  }
  $("#activity").prepend(el("li", {}, ...parts));
}

/* ---------- Boot ---------- */

async function boot() {
  [state.players, state.items] = await Promise.all([api("/api/players"), api("/api/items")]);

  const typeSelect = $("#event-type");
  for (const [type, def] of Object.entries(EVENTS)) typeSelect.append(el("option", { value: type, text: def.label }));
  typeSelect.addEventListener("change", renderEventFields);
  renderEventFields();

  const tpl = $("#pane-tpl");
  [1, 3].forEach((playerId, i) => {
    const node = tpl.content.firstElementChild.cloneNode(true);
    $("#panes").append(node);
    new PlayerPane(node, playerId, i === 0);
  });

  $("#event-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      await fire(readEventForm());
      setHint("Event published.");
    } catch (err) {
      setHint(err.message, true);
    }
  });

  $("#run-brief").addEventListener("click", async (e) => {
    e.target.disabled = true;
    try {
      for (const payload of BRIEF_EXAMPLES) {
        await fire(payload);
        await new Promise((r) => setTimeout(r, 400));
      }
      setHint("Ran the 4 example triggers from the brief.");
    } catch (err) {
      setHint(err.message, true);
    } finally {
      e.target.disabled = false;
    }
  });
}

boot().catch((err) => setHint(`Failed to load: ${err.message}`, true));
</script>
</body>
</html>
